seo:
  home:
    title:
      pl: Mafia+ - rozszerzona wersja gry towarzysko-detektywistycznej
      en: Mafia+ - an extended take on the social deduction game
    description:
      pl: Rozszerzona wersja klasycznej Mafii. Trzy frakcje, autorskie karty postaci, pełne zasady i gotowe zestawy do gry. Wszystko darmowe, potrzebujesz tylko ludzi do grania!
      en: An extended take on the classic social-deduction game Mafia. Three factions, custom character cards, complete rules, and ready-to-play example sets. All free, all you need is people to play!
  downloads:
    title:
      pl: Materiały do pobrania - Mafia+
      en: Downloads - Mafia+
    description:
      pl: Pobierz pełny podręcznik Mafia+ - wszystkie zasady, postacie i przykładowe zestawy — jako PDF lub Markdown, po polsku i po angielsku.
      en: Download the complete Mafia+ rulebook - every rule, character and example set — as a PDF or Markdown file, in Polish and English.
  notFound:
    title:
      pl: Nie ma takiej strony - Mafia+
      en: Page not found - Mafia+
    description:
      pl: Pod tym adresem nic nie ma. Wróć na stronę główną Mafia+ po zasady, karty postaci i przykładowe zestawy.
      en: There is nothing at this address. Head back to the Mafia+ home page for the rules, character cards and example sets.
